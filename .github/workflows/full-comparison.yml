name: full-comparison
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline commit to compare with the identical harness
        required: true
        default: 6978be9ea247819feeb7748bf6eea077138002a7
        type: string
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Unrequested pushes must not replace a queued requested comparison.
  group: full-comparison-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-comparison]')) && github.ref || github.sha }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-comparison]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 3
      CXXFLAGS: '-g0'
      KV_BENCH_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - name: Resolve baseline
        id: baseline
        env:
          REQUESTED_BASELINE: ${{ inputs.baseline }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os, re
          markers = re.findall(r"\[baseline:([0-9a-fA-F]{40})\]", os.environ.get("COMMIT_MESSAGE", ""))
          ref = os.environ.get("REQUESTED_BASELINE") or (markers[0] if len(markers) == 1 else "")
          if len(markers) > 1 or not re.fullmatch(r"[0-9a-fA-F]{40}", ref):
              raise ValueError("Specify one exact baseline commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ref={ref}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - name: Validate engine and harness formatting
        run: |
          cargo fmt --check
          cargo fmt --manifest-path benchmarks/rocksdb-compare/Cargo.toml --check
          cargo test --locked --release
          cargo test --locked --release --all-features
          python3 -m compileall -q benchmarks/rocksdb-compare
          python3 -m unittest discover -s benchmarks/rocksdb-compare -p test_measurement_paths.py
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: actions/cache@v4
        with:
          path: benchmarks/rocksdb-compare/target
          key: rocksdb-compare-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('benchmarks/rocksdb-compare/Cargo.lock') }}
      - name: Build matching baseline, current and RocksDB harnesses
        id: build
        run: |
          mkdir -p comparison-bin
          cp benchmarks/rocksdb-compare/src/bin/workloads.rs baseline/benchmarks/rocksdb-compare/src/bin/workloads.rs
          cp benchmarks/rocksdb-compare/src/workloads_backend.rs baseline/benchmarks/rocksdb-compare/src/workloads_backend.rs
          cp benchmarks/rocksdb-compare/src/bounds_workload.rs baseline/benchmarks/rocksdb-compare/src/bounds_workload.rs
          cp benchmarks/rocksdb-compare/src/main.rs baseline/benchmarks/rocksdb-compare/src/main.rs
          cp benchmarks/rocksdb-compare/src/backend.rs baseline/benchmarks/rocksdb-compare/src/backend.rs
          cargo build --locked --release --manifest-path baseline/benchmarks/rocksdb-compare/Cargo.toml --bins
          cp baseline/benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-baseline
          cp baseline/benchmarks/rocksdb-compare/target/release/kv-compare comparison-bin/baseline
          cargo clippy --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bins -- -D warnings
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bins
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-engine
          cp benchmarks/rocksdb-compare/target/release/kv-compare comparison-bin/engine
          cargo clippy --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bins --features rocks -- -D warnings
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bins --features rocks
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-rocksdb
          cp benchmarks/rocksdb-compare/target/release/kv-compare comparison-bin/rocksdb
      - name: Smoke check all three backends
        run: |
          python3 benchmarks/rocksdb-compare/workloads.py full-results/smoke --smoke --baseline
          KV_COMPARE_SMOKE=1 python3 benchmarks/rocksdb-compare/run.py full-results/random-smoke --baseline
      - name: Point reads, ranges, writes and compaction across every public profile
        timeout-minutes: 20
        run: python3 benchmarks/rocksdb-compare/workloads.py full-results/paired --baseline
      - name: Large random reads, latency, process memory and SST size
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 35
        run: python3 benchmarks/rocksdb-compare/run.py full-results/random --baseline --trials 12 --engine-control
      - name: Native-format first ranges after reopen
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        run: python3 benchmarks/rocksdb-compare/bounds.py full-results/bounds
      - name: Repeated first traces with fresh handles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        run: python3 benchmarks/rocksdb-compare/workloads.py full-results/reopened --baseline --reads-only --profile 0 --scenario scan-t1-span32 --trials 12 --reopens 32
      - name: Durable write sizes and flush pressure
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        run: python3 benchmarks/rocksdb-compare/writes.py full-results/writes
      - name: Recovery, mixed traffic, snapshots, cache pressure and key shapes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: python3 benchmarks/rocksdb-compare/remaining.py full-results/remaining
      - name: Preserve completed read, write and recovery checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-comparison-read-recovery-checkpoint
          path: full-results/
          if-no-files-found: error
      - name: Memory scan scaling and point lookups
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        run: python3 benchmarks/rocksdb-compare/remaining.py full-results/scan-scaling --scan-focus
      - name: Actual and unchanged compactions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        run: python3 benchmarks/rocksdb-compare/compactions.py full-results/compactions --repeat --allow-format-change
      - name: Every merge fan-in, key size and overlap history
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: python3 benchmarks/rocksdb-compare/merge_matrix.py full-results/merge-matrix --allow-format-change
      - name: Internal profiles and durable long-key overwrites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          python3 benchmarks/rocksdb-compare/internal.py full-results/internal
          python3 benchmarks/rocksdb-compare/focused.py full-results/focused
          python3 benchmarks/rocksdb-compare/maintenance.py full-results/maintenance
          python3 benchmarks/rocksdb-compare/maintenance.py full-results/compact-request compact_request_profile
      - name: Tombstones, repeated reopen and separately instrumented write phases
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bin workloads --features write-profiling
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-engine-profile
          cargo build --locked --release --manifest-path baseline/benchmarks/rocksdb-compare/Cargo.toml --bin workloads --features write-profiling
          cp baseline/benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-baseline-profile
          python3 benchmarks/rocksdb-compare/audit.py full-results/audit
      - name: Validate and summarize all public comparisons
        run: |
          python3 benchmarks/rocksdb-compare/summarize_full.py full-results "${{ github.sha }}" "${{ steps.baseline.outputs.ref }}" --fixed-paths
          python3 benchmarks/rocksdb-compare/export_results.py full-results/comparison-summary.json full-results/all-public-conditions.csv
      - name: Optional production snapshot CPU scaling
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(github.event.head_commit.message, '[snapshot-scaling-guard]') }}
        timeout-minutes: 15
        run: python3 benchmarks/rocksdb-compare/snapshot_scaling.py extra-results/snapshot-cpu
      - name: Optional native long-key range confirmation
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(github.event.head_commit.message, '[prefix-range-guard]') }}
        timeout-minutes: 15
        run: python3 benchmarks/rocksdb-compare/remaining.py extra-results/prefix-ranges --trials 12 --case prefix-range-4096-10 --case prefix-range-4096-512 --case prefix-range-4096-20000 --case prefix-range-16384-10 --case prefix-range-16384-512 --case prefix-range-16384-20000
      - name: Preserve raw measurements and exact harness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-comparison
          path: |
            full-results/
            extra-results/
            benchmarks/rocksdb-compare/Cargo.lock
          if-no-files-found: error
