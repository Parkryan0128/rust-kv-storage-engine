name: read-layout-diagnostics
on:
  workflow_dispatch:
    inputs:
      baseline:
        required: true
        default: c0299ec14e60a249fb9628f1888c5740c655432b
        type: string
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[read-layout-diag]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 3
      KV_BENCH_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - name: Resolve baseline
        id: baseline
        env:
          REQUESTED_BASELINE: ${{ inputs.baseline }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os, re
          markers = re.findall(r"\[baseline:([0-9a-fA-F]{40})\]", os.environ.get("COMMIT_MESSAGE", ""))
          ref = os.environ.get("REQUESTED_BASELINE") or (markers[0] if len(markers) == 1 else "")
          if len(markers) > 1 or not re.fullmatch(r"[0-9a-fA-F]{40}", ref):
              raise ValueError("Specify one exact baseline commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ref={ref}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Build matching normal engine harnesses
        run: |
          mkdir -p comparison-bin
          cp benchmarks/rocksdb-compare/src/bin/workloads.rs baseline/benchmarks/rocksdb-compare/src/bin/workloads.rs
          cp benchmarks/rocksdb-compare/src/workloads_backend.rs baseline/benchmarks/rocksdb-compare/src/workloads_backend.rs
          cp benchmarks/rocksdb-compare/src/bounds_workload.rs baseline/benchmarks/rocksdb-compare/src/bounds_workload.rs
          cp benchmarks/rocksdb-compare/src/main.rs baseline/benchmarks/rocksdb-compare/src/main.rs
          cp benchmarks/rocksdb-compare/src/backend.rs baseline/benchmarks/rocksdb-compare/src/backend.rs
          cargo build --locked --release --manifest-path baseline/benchmarks/rocksdb-compare/Cargo.toml --bin workloads
          cp baseline/benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-baseline
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bin workloads
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-engine
          python3 -m py_compile benchmarks/rocksdb-compare/bounds_layout.py
      - name: Compare native and identical paths with an identical-binary control
        run: python3 benchmarks/rocksdb-compare/bounds_layout.py read-layout-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-layout-${{ matrix.os }}
          path: read-layout-results/
