name: write-diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[write-diag]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 3
      CXXFLAGS: '-g0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev strace
      - uses: actions/cache@v4
        with:
          path: benchmarks/rocksdb-compare/target
          key: rocksdb-compare-${{ runner.os }}-${{ hashFiles('benchmarks/rocksdb-compare/Cargo.lock') }}
      - name: Build normal and instrumented engines
        run: |
          mkdir -p comparison-bin
          cargo fmt --manifest-path benchmarks/rocksdb-compare/Cargo.toml --check
          cargo clippy --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bin workloads --features write-profiling -- -D warnings
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bin workloads --features write-profiling
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-profile
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bin workloads
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-engine
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bin workloads --features rocks
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-rocksdb
      - name: Diagnose batch tails and file allocation
        run: python3 benchmarks/rocksdb-compare/write_diagnostics.py write-diagnostics
        env:
          KV_BENCH_DIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: write-diagnostics
          path: write-diagnostics/
