name: performance-regression-loop
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline commit to compare with the identical harness
        required: true
        default: c0299ec14e60a249fb9628f1888c5740c655432b
        type: string
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Unrequested pushes must not replace a queued requested comparison.
  group: performance-regression-loop-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[performance-regression-loop]')) && github.ref || github.sha }}${{ contains(github.event.head_commit.message, '[recovery-only]') && '-recovery' || '' }}${{ contains(github.event.head_commit.message, '[large-frame-guard]') && '-large-frame' || '' }}${{ contains(github.event.head_commit.message, '[cache-policy-guard]') && '-cache-policy' || '' }}${{ contains(github.event.head_commit.message, '[prefix-block-guard]') && '-prefix' || '' }}${{ contains(github.event.head_commit.message, '[long-key-guard]') && '-long-key' || '' }}${{ contains(github.event.head_commit.message, '[merge-guard]') && '-merge' || '' }}${{ contains(github.event.head_commit.message, '[published-read-guard]') && '-published' || '' }}${{ contains(github.event.head_commit.message, '[prefix-budget-guard]') && '-prefix-budget' || '' }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[performance-regression-loop]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
      CXXFLAGS: '-g0'
      KV_BENCH_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - name: Resolve baseline
        id: baseline
        env:
          REQUESTED_BASELINE: ${{ inputs.baseline }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os, re
          markers = re.findall(r"\[baseline:([0-9a-fA-F]{40})\]", os.environ.get("COMMIT_MESSAGE", ""))
          ref = os.environ.get("REQUESTED_BASELINE") or (markers[0] if len(markers) == 1 else "")
          if len(markers) > 1 or not re.fullmatch(r"[0-9a-fA-F]{40}", ref):
              raise ValueError("Specify one exact baseline commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ref={ref}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - name: Validate engine and harness formatting
        run: |
          cargo fmt --check
          cargo fmt --manifest-path benchmarks/rocksdb-compare/Cargo.toml --check
          cargo test --locked --release
          cargo test --locked --release --all-features
          python3 -m compileall -q benchmarks/rocksdb-compare
          python3 -m unittest discover -s benchmarks/rocksdb-compare -p test_measurement_paths.py
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: actions/cache@v4
        with:
          path: benchmarks/rocksdb-compare/target
          key: rocksdb-compare-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('benchmarks/rocksdb-compare/Cargo.lock') }}
      - name: Build matching baseline, current and RocksDB harnesses
        id: build
        run: |
          mkdir -p comparison-bin
          cp benchmarks/rocksdb-compare/src/bin/workloads.rs baseline/benchmarks/rocksdb-compare/src/bin/workloads.rs
          cp benchmarks/rocksdb-compare/src/workloads_backend.rs baseline/benchmarks/rocksdb-compare/src/workloads_backend.rs
          cp benchmarks/rocksdb-compare/src/bounds_workload.rs baseline/benchmarks/rocksdb-compare/src/bounds_workload.rs
          cp benchmarks/rocksdb-compare/src/main.rs baseline/benchmarks/rocksdb-compare/src/main.rs
          cp benchmarks/rocksdb-compare/src/backend.rs baseline/benchmarks/rocksdb-compare/src/backend.rs
          cargo build --locked --release --manifest-path baseline/benchmarks/rocksdb-compare/Cargo.toml --bins
          cp baseline/benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-baseline
          cp baseline/benchmarks/rocksdb-compare/target/release/kv-compare comparison-bin/baseline
          cargo clippy --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bins -- -D warnings
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bins
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-engine
          cp benchmarks/rocksdb-compare/target/release/kv-compare comparison-bin/engine
          cargo clippy --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bins --features rocks -- -D warnings
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bins --features rocks
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-rocksdb
          cp benchmarks/rocksdb-compare/target/release/kv-compare comparison-bin/rocksdb
      - name: Preserve optimized read-path assembly
        if: ${{ contains(github.event.head_commit.message, '[read-codegen]') }}
        run: |
          python3 - <<'PY'
          import hashlib, re, subprocess
          from pathlib import Path
          output = Path("focused-results/read-codegen")
          output.mkdir(parents=True, exist_ok=True)
          targets = ("contains_hash", "get_hashed", "read_next", "next_live")
          for name in ["baseline", "engine"]:
              binary = Path("comparison-bin/workloads-" + name)
              symbols = subprocess.check_output(["nm", "-S", "-C", str(binary)], text=True)
              (output / (name + "-symbols.txt")).write_text(symbols)
              assembly = subprocess.check_output(["objdump", "-d", "-C", str(binary)], text=True)
              selected, keep = [], False
              for line in assembly.splitlines():
                  if re.match(r"^[0-9a-f]+ <.*>:$", line):
                      keep = any(t in line for t in targets)
                  if keep:
                      selected.append(line)
              (output / (name + "-assembly.txt")).write_text("\n".join(selected) + "\n")
              (output / (name + "-sha256.txt")).write_text(hashlib.sha256(binary.read_bytes()).hexdigest() + "\n")
          PY
      - name: Smoke check all three backends
        run: |
          python3 benchmarks/rocksdb-compare/workloads.py full-results/smoke --smoke --baseline
          KV_COMPARE_SMOKE=1 python3 benchmarks/rocksdb-compare/run.py full-results/random-smoke --baseline
      - name: First scans with fresh handles and normal range throughput
        if: ${{ !contains(github.event.head_commit.message, '[recovery-only]') }}
        run: |
          python3 benchmarks/rocksdb-compare/workloads.py focused-results/reopened --baseline --reads-only --profile 0 --scenario scan-t1-span32 --trials 12 --reopens 32
          python3 benchmarks/rocksdb-compare/workloads.py focused-results/ranges --baseline --reads-only --scenario scan-t1-span32
          python3 benchmarks/rocksdb-compare/workloads.py focused-results/open-guard --baseline --reads-only --profile 0 --scenario scan-t1-span32 --trials 12
      - name: Snapshot writes, release and memory lookup guards
        if: ${{ !contains(github.event.head_commit.message, '[recovery-only]') || contains(github.event.head_commit.message, '[snapshot-guard]') }}
        run: |
          python3 benchmarks/rocksdb-compare/remaining.py focused-results/snapshot --trials 12 --case snapshot-write32 --case snapshot-narrow-write32 --case snapshot-release --case keys-variable-memory --case keys-common128-memory
          python3 benchmarks/rocksdb-compare/remaining.py focused-results/memory --scan-focus
          python3 benchmarks/rocksdb-compare/bounds.py focused-results/bounds
      - name: Durable writes and isolated snapshot CPU profiles
        if: ${{ !contains(github.event.head_commit.message, '[recovery-only]') || contains(github.event.head_commit.message, '[snapshot-guard]') }}
        run: |
          python3 benchmarks/rocksdb-compare/writes.py focused-results/writes --trials 12
          python3 benchmarks/rocksdb-compare/internal.py focused-results/internal
      - name: Tombstone scan regressions and separately timed write phases
        if: ${{ !contains(github.event.head_commit.message, '[recovery-only]') || contains(github.event.head_commit.message, '[snapshot-guard]') }}
        run: |
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bin workloads --features write-profiling
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-engine-profile
          cargo build --locked --release --manifest-path baseline/benchmarks/rocksdb-compare/Cargo.toml --bin workloads --features write-profiling
          cp baseline/benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-baseline-profile
          python3 benchmarks/rocksdb-compare/audit.py focused-results/audit
      - name: Cached reads and Bloom routing guard
        if: ${{ contains(github.event.head_commit.message, '[cached-read-guard]') }}
        run: |
          python3 benchmarks/rocksdb-compare/workloads.py focused-results/cache-hot4k --baseline --reads-only --profile 0 --scenario hot-t1-span0 --trials 12
          python3 benchmarks/rocksdb-compare/workloads.py focused-results/cache-hot16k --baseline --reads-only --profile 1 --scenario hot-t1-span0 --trials 12
          python3 benchmarks/rocksdb-compare/remaining.py focused-results/cache-routing --trials 12 --case keys-common128-disk --case phase-20000-4m
      - name: Long range reads and first-query bounds guard
        if: ${{ contains(github.event.head_commit.message, '[range-read-guard]') }}
        run: |
          for profile in 0 1 2 3; do
            python3 benchmarks/rocksdb-compare/workloads.py focused-results/range-profile-${profile} --baseline --reads-only --profile ${profile} --scenario scan-t1-span512 --trials 12
          done
          python3 benchmarks/rocksdb-compare/workloads.py focused-results/range-short --baseline --reads-only --scenario scan-t1-span32 --trials 12
          python3 benchmarks/rocksdb-compare/bounds.py focused-results/range-bounds --trials 12
          python3 benchmarks/rocksdb-compare/remaining.py focused-results/range-memory --scan-focus --trials 12
      - name: Mixed-size cached reads and separate memory Get throughput
        if: ${{ contains(github.event.head_commit.message, '[read-variance-guard]') }}
        run: |
          python3 benchmarks/rocksdb-compare/remaining.py focused-results/mixed-size --trials 12 --case mixed-small-large --case mixed-pressure-4m
          python3 benchmarks/rocksdb-compare/remaining.py focused-results/memory-throughput --trials 12 --case memory-get20k-throughput --case memory-get100k-throughput
      - name: Large owned values with and without caching and retained after eviction
        if: ${{ contains(github.event.head_commit.message, '[large-value-guard]') }}
        run: python3 benchmarks/rocksdb-compare/remaining.py focused-results/large-values --trials 12 --case oversized-2m --case oversized-2m-no-cache --case retained-large-0 --case retained-large-1048576
      - name: Multi-record large blocks retain ordinary lookup behavior
        if: ${{ contains(github.event.head_commit.message, '[large-frame-guard]') }}
        run: python3 benchmarks/rocksdb-compare/remaining.py focused-results/large-frames --trials 12 --case large-frame-128-0 --case large-frame-128-8388608 --case large-frame-32768-0 --case large-frame-32768-8388608
      - name: Compare default and tuned RocksDB cache policies with equal total capacity
        if: ${{ contains(github.event.head_commit.message, '[cache-policy-guard]') }}
        run: python3 benchmarks/rocksdb-compare/remaining.py focused-results/cache-policy --trials 12 --case policy-lru-default-oversized2m --case policy-lru-default-mixed2m --case policy-lru-default-mixed4m --case policy-lru-default-small-4096 --case policy-lru-default-small-16384 --case policy-lru-single-oversized2m --case policy-lru-single-mixed2m --case policy-lru-single-mixed4m --case policy-lru-single-small-4096 --case policy-lru-single-small-16384 --case policy-hyperclock-oversized2m --case policy-hyperclock-mixed2m --case policy-hyperclock-mixed4m --case policy-hyperclock-small-4096 --case policy-hyperclock-small-16384
      - name: Variable and common-prefix memory keys
        if: ${{ contains(github.event.head_commit.message, '[memory-key-guard]') }}
        run: python3 benchmarks/rocksdb-compare/remaining.py focused-results/memory-keys --trials 12 --case keys-variable-memory --case keys-common128-memory
      - name: Durable write guards for focused comparisons
        if: ${{ contains(github.event.head_commit.message, '[durable-write-guard]') && contains(github.event.head_commit.message, '[recovery-only]') }}
        run: python3 benchmarks/rocksdb-compare/writes.py focused-results/writes-guard --trials 12
      - name: Prefix-frame merge and cached or uncached read guards
        if: ${{ contains(github.event.head_commit.message, '[prefix-block-guard]') || contains(github.event.head_commit.message, '[merge-guard]') }}
        run: |
          python3 benchmarks/rocksdb-compare/merge_matrix.py focused-results/prefix-merge --allow-format-change --trials 12
      - name: Compaction Bloom rebuilding beyond retained-hash capacity
        if: ${{ contains(github.event.head_commit.message, '[bloom-readback-guard]') }}
        run: python3 benchmarks/rocksdb-compare/merge_matrix.py focused-results/merge-bloom-readback --trials 12 --case n4-k8-overlap-wide --case n4-k136-overlap-wide --case n16-k8-overlap-wide --case n16-k136-overlap-wide
      - name: Long common-prefix cached and uncached read guards
        if: ${{ contains(github.event.head_commit.message, '[prefix-block-guard]') || contains(github.event.head_commit.message, '[long-key-guard]') }}
        run: |
          python3 benchmarks/rocksdb-compare/remaining.py focused-results/prefix-reads --trials 12 --case keys-variable-disk --case keys-common128-disk --case prefix-disk-4096-0 --case prefix-disk-4096-8388608 --case prefix-disk-16384-0 --case prefix-disk-16384-8388608
      - name: First reads from freshly published tables
        if: ${{ contains(github.event.head_commit.message, '[published-read-guard]') }}
        run: python3 benchmarks/rocksdb-compare/remaining.py focused-results/published-reads --trials 24 --case published-variable-4096 --case published-variable-16384 --case published-common-4096 --case published-common-16384
      - name: Large memory indexes and retained-snapshot copy scaling
        if: ${{ contains(github.event.head_commit.message, '[snapshot-scaling-guard]') }}
        timeout-minutes: 20
        run: |
          python3 benchmarks/rocksdb-compare/remaining.py focused-results/snapshot-scaling --trials 12 --case snapshot-write32-100k --case snapshot-write32-1m --case memory-get1m-throughput --case memory-early10-1m
          python3 benchmarks/rocksdb-compare/snapshot_scaling.py focused-results/snapshot-cpu
      - name: Native prefix compaction fan-in with 16 KiB blocks
        if: ${{ contains(github.event.head_commit.message, '[prefix-budget-guard]') }}
        run: python3 benchmarks/rocksdb-compare/merge_matrix.py focused-results/merge-prefix-budget --trials 24 --case n8-k8-distinct-16k --case n8-k136-distinct-16k --case n16-k8-distinct-16k --case n16-k136-distinct-16k
      - name: Large range acquisition and retained-snapshot CPU guard
        if: ${{ contains(github.event.head_commit.message, '[snapshot-range-guard]') }}
        timeout-minutes: 12
        run: |
          python3 benchmarks/rocksdb-compare/remaining.py focused-results/memory-large-range --trials 12 --case memory-early10-1m
          python3 benchmarks/rocksdb-compare/snapshot_scaling.py focused-results/snapshot-cpu
      - name: Native prefix ranges and unchanged short-key range guards
        if: ${{ contains(github.event.head_commit.message, '[prefix-range-guard]') }}
        run: |
          python3 benchmarks/rocksdb-compare/remaining.py focused-results/prefix-ranges --trials 12 --case prefix-range-4096-10 --case prefix-range-4096-512 --case prefix-range-4096-20000 --case prefix-range-16384-10 --case prefix-range-16384-512 --case prefix-range-16384-20000
          python3 benchmarks/rocksdb-compare/workloads.py focused-results/short-range --baseline --reads-only --profile 1 --scenario scan-t1-span512 --trials 12
      - name: Recovery shapes beyond sequential ingestion
        run: python3 benchmarks/rocksdb-compare/remaining.py focused-results/recovery --trials 12 --case wal-single --case wal-batch256 --case wal-random --case wal-overwrite --case wal-put-sorted --case wal-put-random100k --case wal-batch32-random100k
      - name: Large-index clustered overwrite guard
        if: ${{ contains(github.event.head_commit.message, '[recovery-hotspot]') }}
        run: python3 benchmarks/rocksdb-compare/remaining.py focused-results/recovery-hotspot --trials 12 --case wal-large-hotspot
      - name: Recovery with larger values
        if: ${{ contains(github.event.head_commit.message, '[recovery-value-guard]') }}
        run: python3 benchmarks/rocksdb-compare/remaining.py focused-results/recovery-values --trials 12 --case wal-random-1k --case wal-random-16k --case wal-sorted-16k
      - name: Preserve completed write and recovery checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ${{ contains(github.event.head_commit.message, '[recovery-only]') && 'recovery-checkpoint' || 'regression-checkpoint' }}
          path: focused-results/
      - name: Million-key random reads with identical-binary noise control
        if: ${{ !contains(github.event.head_commit.message, '[recovery-only]') }}
        run: python3 benchmarks/rocksdb-compare/run.py focused-results/random --baseline --trials 12 --engine-control
      - name: Preserve raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ contains(github.event.head_commit.message, '[recovery-only]') && 'recovery-comparison' || 'performance-regression-loop' }}
          path: |
            focused-results/
            benchmarks/rocksdb-compare/Cargo.lock
