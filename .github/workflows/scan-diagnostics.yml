name: scan-diagnostics
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[scan-diag]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve baseline
        id: baseline
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os,re
          markers = re.findall(r"\[baseline:([0-9a-fA-F]{40})\]", os.environ["COMMIT_MESSAGE"])
          assert len(markers) == 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ref=" + markers[0] + "\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare memory scan paths without building RocksDB
        timeout-minutes: 12
        run: |
          cp src/memory_scan_profile.rs baseline/src/memory_scan_profile.rs
          cp src/read_profile.rs baseline/src/read_profile.rs
          cp examples/snapshot_profile.rs baseline/examples/snapshot_profile.rs
          python3 benchmarks/rocksdb-compare/internal.py scan-diagnostics-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-diagnostics
          path: scan-diagnostics-results/
