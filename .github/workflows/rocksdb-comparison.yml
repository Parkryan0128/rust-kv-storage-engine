name: rocksdb-comparison
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/rocksdb-compare/**'
      - '.github/workflows/rocksdb-comparison.yml'
  pull_request:
    paths:
      - 'benchmarks/rocksdb-compare/**'
      - '.github/workflows/rocksdb-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rocksdb-comparison-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 3
      CXXFLAGS: '-g0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out the pre-compaction-format baseline
        uses: actions/checkout@v4
        with:
          ref: ef358614095922dccbcf36fdaddc1aa174b1cb9d
          path: baseline-source
      - name: Share only the benchmark harness with the baseline
        run: python3 benchmarks/rocksdb-compare/prepare_baseline.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: |
          cargo fmt --check
          cargo fmt --manifest-path benchmarks/rocksdb-compare/Cargo.toml --check
      - name: Validate engine
        run: cargo test --locked --release --all-features
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: actions/cache@v4
        with:
          path: benchmarks/rocksdb-compare/target
          key: rocksdb-compare-${{ runner.os }}-${{ hashFiles('benchmarks/rocksdb-compare/Cargo.lock') }}
      - name: Build identical random-read harnesses
        run: |
          mkdir -p comparison-bin
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml
          cp benchmarks/rocksdb-compare/target/release/kv-compare comparison-bin/engine
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --features rocks
          cp benchmarks/rocksdb-compare/target/release/kv-compare comparison-bin/rocksdb
          cargo build --locked --release --manifest-path baseline-source/benchmarks/rocksdb-compare/Cargo.toml
          cp baseline-source/benchmarks/rocksdb-compare/target/release/kv-compare comparison-bin/baseline
          cargo test --locked --release --lib --manifest-path baseline-source/Cargo.toml --no-run
      - name: Verify small random workload
        run: python3 benchmarks/rocksdb-compare/run.py comparison-smoke
        env:
          KV_COMPARE_SMOKE: '1'
          KV_BENCH_DIR: ${{ runner.temp }}
      - name: Measure random reads
        run: python3 benchmarks/rocksdb-compare/run.py comparison-results
        env:
          KV_BENCH_DIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocksdb-random-read
          path: |
            comparison-results/
            comparison-smoke/
            benchmarks/rocksdb-compare/Cargo.lock
