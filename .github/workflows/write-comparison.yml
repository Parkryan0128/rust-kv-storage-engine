name: write-comparison
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline commit supporting WriteBatch (same harness is copied into it)
        required: true
        default: 9b50fb6f330d5c78b8c8e8f205578686624da7db
        type: string
      compaction:
        description: Also compare compaction on identical engine fixtures and matched RocksDB history
        default: false
        type: boolean
      reads:
        description: Also compare bounded point reads and disk range scans against baseline and RocksDB
        default: false
        type: boolean
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: write-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[write-perf]') || contains(github.event.head_commit.message, '[compact-perf]') || contains(github.event.head_commit.message, '[cleanup-perf]') || contains(github.event.head_commit.message, '[paired-perf]') || contains(github.event.head_commit.message, '[followup-perf]') || contains(github.event.head_commit.message, '[scan-perf]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 3
      CXXFLAGS: '-g0'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve comparison baseline
        id: baseline
        env:
          REQUESTED_BASELINE: ${{ inputs.baseline }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os, re
          message = os.environ.get("COMMIT_MESSAGE", "")
          markers = re.findall(r"\[baseline:([0-9a-fA-F]{40})\]", message)
          if len(markers) > 1:
              raise ValueError("Specify only one baseline marker")
          fallback = "9b50fb6f330d5c78b8c8e8f205578686624da7db" if "[cleanup-perf]" in message else os.environ.get("PUSH_BEFORE", "")
          ref = os.environ.get("REQUESTED_BASELINE") or (markers[0] if markers else fallback)
          if not ref or "\n" in ref or "\r" in ref:
              raise ValueError("Missing or invalid baseline")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ref={ref}\n")
          print(f"Comparison baseline: {ref}")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify engine before benchmarking
        run: cargo test --locked --release --all-features
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: actions/cache@v4
        with:
          path: benchmarks/rocksdb-compare/target
          key: rocksdb-compare-${{ runner.os }}-${{ hashFiles('benchmarks/rocksdb-compare/Cargo.lock') }}
      - name: Build identical harnesses against baseline, current, and RocksDB
        run: |
          mkdir -p comparison-bin
          cargo fmt --manifest-path benchmarks/rocksdb-compare/Cargo.toml --check
          cp benchmarks/rocksdb-compare/src/bin/workloads.rs baseline/benchmarks/rocksdb-compare/src/bin/workloads.rs
          cp benchmarks/rocksdb-compare/src/workloads_backend.rs baseline/benchmarks/rocksdb-compare/src/workloads_backend.rs
          cargo build --locked --release --manifest-path baseline/benchmarks/rocksdb-compare/Cargo.toml --bin workloads
          cp baseline/benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-baseline
          cargo clippy --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bin workloads -- -D warnings
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bin workloads
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-engine
          cargo clippy --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bin workloads --features rocks -- -D warnings
          cargo build --locked --release --manifest-path benchmarks/rocksdb-compare/Cargo.toml --bin workloads --features rocks
          cp benchmarks/rocksdb-compare/target/release/workloads comparison-bin/workloads-rocksdb
      - name: Compare remaining recovery, cache, and active-scan workloads
        if: contains(github.event.head_commit.message, '[remaining-perf]') || contains(github.event.head_commit.message, '[scan-perf]')
        timeout-minutes: 8
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          KV_BENCH_DIR: ${{ runner.temp }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[scan-perf]"* ]]; then
            python3 benchmarks/rocksdb-compare/remaining.py remaining-results --scan-focus
          else
            python3 benchmarks/rocksdb-compare/remaining.py remaining-results
          fi
      - name: Compare interleaved memory snapshots, writes, and cache hits
        if: contains(github.event.head_commit.message, '[remaining-perf]') || contains(github.event.head_commit.message, '[scan-perf]')
        timeout-minutes: 8
        run: |
          mkdir -p internal-profile-results
          cp src/memory_scan_profile.rs baseline/src/memory_scan_profile.rs
          cp src/read_profile.rs baseline/src/read_profile.rs
          if ! grep -q 'mod memory_scan_profile;' baseline/src/engine.rs; then
            printf '\n#[cfg(test)]\n#[path = "memory_scan_profile.rs"]\nmod memory_scan_profile;\n' >> baseline/src/engine.rs
          fi
          python3 benchmarks/rocksdb-compare/internal.py internal-profile-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-optimization-comparison
          path: |
            remaining-results/
            internal-profile-results/
          if-no-files-found: ignore
      - name: Compare bounded durable writes and flush pressure
        if: ${{ !contains(github.event.head_commit.message, '[followup-perf]') }}
        timeout-minutes: 8
        run: python3 benchmarks/rocksdb-compare/writes.py write-results
        env:
          KV_BENCH_DIR: ${{ runner.temp }}
      - name: Recheck small-value batch writes
        if: contains(github.event.head_commit.message, '[followup-perf]')
        timeout-minutes: 5
        run: python3 benchmarks/rocksdb-compare/writes.py write-results --case batch256-16b --trials 12
        env:
          KV_BENCH_DIR: ${{ runner.temp }}
      - name: Recheck large-value range scans
        if: contains(github.event.head_commit.message, '[followup-perf]')
        timeout-minutes: 5
        run: python3 benchmarks/rocksdb-compare/workloads.py read-results --baseline --reads-only --profile 5 --scenario scan-t1-span512 --trials 12
        env:
          KV_BENCH_DIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: write-comparison
          path: write-results/
      - name: Compare compaction with disjoint and overwritten values
        if: inputs.compaction || contains(github.event.head_commit.message, '[compact-perf]') || contains(github.event.head_commit.message, '[cleanup-perf]')
        timeout-minutes: 8
        run: python3 benchmarks/rocksdb-compare/compactions.py compaction-results
        env:
          KV_BENCH_DIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compaction-comparison
          path: compaction-results/
          if-no-files-found: ignore
      - name: Check paired read orchestration
        if: inputs.reads || contains(github.event.head_commit.message, '[cleanup-perf]') || contains(github.event.head_commit.message, '[paired-perf]')
        run: python3 benchmarks/rocksdb-compare/workloads.py read-smoke --smoke --baseline --reads-only
        env:
          KV_BENCH_DIR: ${{ runner.temp }}
      - name: Compare bounded point reads and disk range scans
        if: inputs.reads || contains(github.event.head_commit.message, '[cleanup-perf]')
        timeout-minutes: 10
        run: python3 benchmarks/rocksdb-compare/workloads.py read-results --baseline --reads-only
        env:
          KV_BENCH_DIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-read-comparison
          path: |
            read-results/
            read-smoke/
          if-no-files-found: ignore
      - name: Compare paired reads, writes, and compaction
        if: contains(github.event.head_commit.message, '[paired-perf]')
        timeout-minutes: 10
        run: python3 benchmarks/rocksdb-compare/workloads.py paired-results --baseline
        env:
          KV_BENCH_DIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-workload-comparison
          path: paired-results/
          if-no-files-found: ignore
