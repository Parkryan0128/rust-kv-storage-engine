[package]
name = "rust-kv-storage-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "An embedded, durable LSM-tree key-value store"

[features]
fault-injection = []

[dependencies]
bytes = "1"
crossbeam = "0.8"
parking_lot = "0.12"
crc32fast = "1"
fs2 = "0.4"

[dev-dependencies]
tiny_http = "0.12"
serde_json = "1"
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "engine"
harness = false

[[bin]]
name = "crash_worker"
path = "src/bin/crash_worker.rs"
required-features = ["fault-injection"]
